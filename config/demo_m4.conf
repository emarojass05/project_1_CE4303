# Configuracion para la demo de M4 con las dos placas (tick de 10 ms).
# Prueba esporadicas (boton y comando s), modo manual (a), caida de un nodo
# (cable o comando k) y el reporte completo. Ver docs/host.md.
algorithm = EDF
heuristic = worst-fit
tick_ms = 10
# ESP32 por USB-serial (nodo 1) y Pico por USB CDC (nodo 2)
ports = /dev/ttyUSB0, /dev/ttyACM0
# Un reporte de tick cada 100 ms; el nodo se declara caido tras 3 perdidos
tick_report_every = 10
missed_reports_for_failure = 3
tasks_file = tasks/demo_m4.csv
