# Configuracion de ejemplo del host.
# Formato: clave = valor. '#' inicia un comentario. Las rutas relativas se
# toman desde la carpeta donde se ejecuta el host (la raiz del repo).

# Algoritmo de los nodos: RMS o EDF
algorithm = EDF

# Heuristica de asignacion: first-fit o worst-fit
heuristic = worst-fit

# Duracion del tick en milisegundos (1 a 1000, por defecto 10)
tick_ms = 10

# Un puerto serial por nodo, separados por comas
ports = /dev/ttyUSB0, /dev/ttyACM0

# Cada cuantos ticks envia el nodo su reporte de tick (1 a 65535, por defecto 10)
tick_report_every = 10

# Reportes consecutivos perdidos para declarar caido un nodo (por defecto 3)
missed_reports_for_failure = 3

# Prueba de admision: on (por defecto) o off. Con off el host asigna sin verificar
# la planificabilidad; solo para experimentos (por ejemplo, forzar una carga que
# RMS no cumple). Opcional.
# admission = on

# Archivo de tareas: id,tipo,W,T,D,criticidad
tasks_file = tasks/ejemplo.csv
