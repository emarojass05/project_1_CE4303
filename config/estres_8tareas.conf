# Prueba de estres del nodo: 8 tareas en el ESP32 (ver tasks/estres_8tareas.csv).
# Un solo nodo. Con EDF la carga (U = 0.88) pasa la prueba de admision.
algorithm = EDF
heuristic = first-fit
tick_ms = 10
ports = /dev/ttyUSB0
tick_report_every = 10
missed_reports_for_failure = 3
tasks_file = tasks/estres_8tareas.csv
