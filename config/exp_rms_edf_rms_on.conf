# Experimento RMS vs EDF: RMS con la prueba de admision activa: la carga se rechaza
# Un solo nodo: el ESP32 (la carga esta calculada para sn entre 55 y 73).
algorithm = RMS
heuristic = first-fit
tick_ms = 10
ports = /dev/ttyUSB0
tick_report_every = 10
missed_reports_for_failure = 3
admission = on
tasks_file = tasks/exp_rms_edf.csv
