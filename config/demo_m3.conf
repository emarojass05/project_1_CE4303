# Configuracion para la demo de M3 con las dos placas.
# Tick lento (250 ms) para poder seguir los LEDs a simple vista.
algorithm = EDF
heuristic = worst-fit
tick_ms = 250
# ESP32 por USB-serial y Pico por USB CDC; cambielos si Linux les dio otro nombre
ports = /dev/ttyUSB0, /dev/ttyACM0
tick_report_every = 4
missed_reports_for_failure = 3
tasks_file = tasks/demo_m3.csv
